name: Kubernetes containerMode test

on:
  workflow_dispatch:

jobs:
  build-with-kubernetes-mode:
    runs-on: arc-runner-set
    container:
      image: alpine:3.20
    steps:
      - name: Confirm no docker.sock, no privileged sidecar, and check identity
        run: |
          echo "== is there a docker socket in this mode? (should be none -- no dind sidecar) =="
          ls -la /var/run/docker.sock 2>&1 || echo "not present, as expected"
          echo
          echo "== CapEff =="
          cat /proc/self/status | grep CapEff
          echo
          echo "hostname of this job's container:"
          hostname
          cat /etc/os-release | head -2
