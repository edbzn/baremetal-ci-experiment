# Cluster-level object metrics (deployments, nodes, pods, resource
# requests/limits, etc.) that neither metrics-server nor a kubelet-only
# scrape provides. Feeds the otel-collector-cluster (deployment mode)
# release's prometheus receiver, not New Relic directly.
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    memory: "256Mi"
