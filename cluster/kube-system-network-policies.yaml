# kube-system had zero NetworkPolicy coverage. Most of its workloads
# (Cilium, kube-proxy, the control-plane static pods) run hostNetwork
# and are entirely unaffected by NetworkPolicy either way — this only
# covers the 5 actual pod-network workloads: coredns, hubble-relay,
# hubble-ui, kata-deploy, metrics-server. Applied and DNS-tested one at
# a time; CoreDNS especially, since getting it wrong breaks cluster DNS
# cluster-wide.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coredns-ingress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 9153
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coredns-egress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  policyTypes:
    - Egress
  egress:
    # CoreDNS forwards non-cluster queries (github.com, etc.) upstream
    # per its own ConfigMap (`forward . /etc/resolv.conf`), which
    # resolves to the libvirt host's own DNS server (192.168.122.1) —
    # missed on the first pass of this policy, which broke *all*
    # external-name resolution cluster-wide (confirmed via ARC's
    # controller failing to reach api.github.com, and CoreDNS's own
    # logs showing `read udp ...->192.168.122.1:53: i/o timeout`).
    - to:
        - ipBlock:
            cidr: 192.168.122.1/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # kube-apiserver access is a separate CiliumNetworkPolicy below —
    # see the note at the bottom of this file for why.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns-apiserver-egress
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-server-ingress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: metrics-server
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 10250
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-server-egress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: metrics-server
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # kube-apiserver AND kubelet-scrape access are both separate
    # CiliumNetworkPolicies below — see the note at the bottom of this
    # file for why a plain ipBlock: 0.0.0.0/0 doesn't work for either.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metrics-server-apiserver-egress
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s-app: metrics-server
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metrics-server-kubelet-egress
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s-app: metrics-server
  egress:
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hubble-relay-ingress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: hubble-relay
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 4245
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hubble-relay-egress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: hubble-relay
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # hubble-relay reaches Cilium agents via the hubble-peer ClusterIP
    # Service (port 443), whose backends are the hostNetwork Cilium
    # agent pods on port 4244 — the same double gap (ClusterIP DNAT +
    # hostNetwork destination) as kube-apiserver/kubelet-scrape above,
    # fixed the same way below.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hubble-relay-agent-egress
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s-app: hubble-relay
  egress:
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "4244"
              protocol: TCP
---
