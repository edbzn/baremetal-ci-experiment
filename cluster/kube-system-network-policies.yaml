---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kata-deploy-egress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      name: kata-deploy
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # kube-apiserver access is a separate CiliumNetworkPolicy below —
    # see the note at the bottom of this file for why.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kata-deploy-apiserver-egress
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      name: kata-deploy
  egress:
    - toEntities:
        - kube-apiserver
---
# Why CiliumNetworkPolicy instead of a plain NetworkPolicy port rule,
# for two distinct destination types:
#
# 1. kube-apiserver (ClusterIP 10.96.0.1:443): Cilium's eBPF datapath
#    DNATs the ClusterIP destination before standard NetworkPolicy
#    port-matching is evaluated in some paths, so a plain
#    `namespaceSelector: {} / port: 443` egress rule silently matches
#    nothing — the same gap Project 6's security drill already found
#    and fixed for arc-runners specifically (a multi-minute hang, not a
#    clean error, the first time). Also worth noting: the in-cluster
#    Service port for the API server is 443 (`kubectl get svc
#    kubernetes`), not kube-apiserver's own listen port 6443 — an easy
#    port-number mistake to make when writing these by hand.
#
# 2. Kubelet scraping (real node IPs, e.g. 192.168.122.140:10250):
#    kubelets run hostNetwork, and Cilium's identity model classifies
#    node-IP-destined traffic as in-cluster, matched via
#    identities/entities rather than CIDR — so a plain
#    `ipBlock: 0.0.0.0/0` egress rule silently excludes node IPs too,
#    by design (confirmed against a Cilium maintainer's own comment on
#    this exact metrics-server/kubelet-scrape scenario:
#    github.com/cilium/cilium/issues/35212). Fix: `toEntities: [host,
#    remote-node]` instead of an ipBlock.
#
# Both are the same underlying lesson: for a Cilium-CNI cluster, any
# egress rule aimed at a ClusterIP or a real node IP needs a
# CiliumNetworkPolicy with the matching `toEntities` value
# (kube-apiserver / host / remote-node) — a plain NetworkPolicy's
# namespaceSelector/ipBlock only reliably covers genuine pod-to-pod and
# pod-to-external-world traffic.
