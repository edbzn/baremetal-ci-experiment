# grafana/alloy - the current, actively-maintained log shipper
# (Promtail is in maintenance mode / being phased out). DaemonSet:
# tails every node's /var/log/pods and forwards to Loki.
#
# Same real gotcha as any log-tailing agent on a self-managed cluster:
# /var/log/pods is root-owned (confirmed directly on this cluster's
# own worker nodes: `ls /var/log/pods` -> Permission denied for a
# non-root user), so the agent container needs to run as root.
alloy:
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: daemonset

securityContext:
  runAsUser: 0
  runAsGroup: 0

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    memory: "256Mi"
