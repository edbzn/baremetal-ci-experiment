# Internal registry running as a cluster workload (unlike Project 1/2's
# host-side registry:2 container) — exposed via a MetalLB LoadBalancer IP
# so it's reachable both from inside the cluster (by Service DNS name) and
# from the host/other VMs (by its LB IP), matching how a real bare-metal
# cluster would run its own registry rather than relying on a dev host.
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
  type: LoadBalancer
