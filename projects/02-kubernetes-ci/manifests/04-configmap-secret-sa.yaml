# Exercises: ConfigMap and Secret injection (env + volume), and the
# per-namespace default ServiceAccount + a dedicated one for CI jobs.

apiVersion: v1
kind: ConfigMap
metadata:
  name: ci-config
  namespace: ci
data:
  GREETING: "hello from a ConfigMap"
  build.conf: |
    retries=3
    timeout=30s
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-registry-token
  namespace: ci
type: Opaque
stringData:
  token: "not-a-real-secret-just-a-demo-value"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-job-runner
  namespace: ci
---
apiVersion: batch/v1
kind: Job
metadata:
  name: config-secret-demo
  namespace: ci
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: ci-job-runner
      restartPolicy: Never
      containers:
        - name: sample-app
          image: ci-registry:5000/sample-app:v1
          command:
            - sh
            - -c
            - |
              echo "env GREETING=$GREETING"
              echo "mounted config file:"
              cat /etc/ci-config/build.conf
              echo "mounted secret token:"
              cat /etc/ci-secret/token
              echo
              echo "serviceaccount token present at default mount:"
              ls /var/run/secrets/kubernetes.io/serviceaccount/
          env:
            - name: GREETING
              valueFrom:
                configMapKeyRef:
                  name: ci-config
                  key: GREETING
          volumeMounts:
            - name: config-vol
              mountPath: /etc/ci-config
            - name: secret-vol
              mountPath: /etc/ci-secret
      volumes:
        - name: config-vol
          configMap:
            name: ci-config
        - name: secret-vol
          secret:
            secretName: ci-registry-token
