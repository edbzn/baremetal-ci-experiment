githubConfigUrl: "https://github.com/edbzn/k8s-bare-metal-ci"
githubConfigSecret: arc-github-app-secret

minRunners: 0
maxRunners: 3

containerMode:
  type: "kubernetes"
  kubernetesModeWorkVolumeClaim:
    accessModes: ["ReadWriteOnce"]
    storageClassName: "local-path"
    resources:
      requests:
        storage: 1Gi

template:
  spec:
    nodeSelector:
      node-role: isolated-ci
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.336.0
        command: ["/home/runner/run.sh"]
