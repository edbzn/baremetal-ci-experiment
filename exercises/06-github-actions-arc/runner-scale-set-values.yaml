githubConfigUrl: "https://github.com/edbzn/k8s-bare-metal-ci"
githubConfigSecret: arc-github-app-secret

minRunners: 0
maxRunners: 3

containerMode:
  type: "" # default: each job runs directly in the runner container (dind/kubernetes modes need extra setup, not used for this first pass)

template:
  spec:
    runtimeClassName: kata-fc
    nodeSelector:
      node-role: isolated-ci
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            memory: "1Gi"
